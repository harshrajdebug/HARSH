name: DSA Practice

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 9 * * *"
    - cron: "45 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 3000))
          echo "Sleeping $DELAY seconds..."
          sleep "$DELAY"
        shell: bash

      - name: Generate DSA commit
        shell: bash
        run: |
          git config user.name  "harshrajdebug"
          git config user.email "harshrajdebug@users.noreply.github.com"

          TOPICS=(arrays linked-list stack queue trees graphs dynamic-programming sorting searching hashing heap recursion backtracking greedy bit-manipulation strings two-pointers sliding-window binary-search trie)
          TOPIC="${TOPICS[$((RANDOM % ${#TOPICS[@]}))]}"

          DIFFS=(easy medium hard)
          DIFF="${DIFFS[$((RANDOM % ${#DIFFS[@]}))]}"

          mkdir -p "$TOPIC"

          PROBLEM_NUM=$((RANDOM % 2000 + 1))

          # Pick a problem name based on topic
          case "$TOPIC" in
            arrays)
              NAMES=(two_sum find_max_subarray rotate_array merge_sorted_arrays product_except_self contains_duplicate max_profit_stock move_zeroes three_sum next_permutation spiral_matrix set_matrix_zeroes longest_consecutive trap_rain_water jump_game)
              ;;
            linked-list)
              NAMES=(reverse_linked_list merge_two_lists detect_cycle remove_nth_node add_two_numbers flatten_list sort_list intersection_of_lists palindrome_linked_list reorder_list swap_pairs rotate_list partition_list reverse_k_group middle_of_list)
              ;;
            stack)
              NAMES=(valid_parentheses min_stack next_greater_element evaluate_rpn daily_temperatures largest_rectangle decode_string asteroid_collision basic_calculator remove_duplicate_letters online_stock_span validate_stack_sequences simplify_path remove_stars redundant_braces)
              ;;
            queue)
              NAMES=(implement_queue sliding_window_max circular_queue rotting_oranges walls_and_gates task_scheduler design_hit_counter moving_average shortest_path_binary open_the_lock snakes_and_ladders perfect_squares word_ladder first_non_repeating generate_binary_numbers)
              ;;
            trees)
              NAMES=(max_depth invert_binary_tree level_order_traversal validate_bst lowest_common_ancestor diameter_of_tree balanced_binary_tree path_sum construct_from_traversals serialize_deserialize kth_smallest_bst zigzag_traversal right_side_view flatten_to_linked_list count_good_nodes)
              ;;
            graphs)
              NAMES=(number_of_islands clone_graph course_schedule pacific_atlantic word_ladder surrounded_regions graph_valid_tree dijkstra topological_sort min_spanning_tree network_delay cheapest_flights alien_dictionary word_search reconstruct_itinerary)
              ;;
            dynamic-programming)
              NAMES=(climbing_stairs house_robber longest_increasing_subseq coin_change edit_distance longest_common_subseq word_break unique_paths decode_ways partition_equal_subset knapsack_01 max_product_subarray min_cost_stairs interleaving_string palindrome_partition)
              ;;
            sorting)
              NAMES=(bubble_sort selection_sort insertion_sort merge_sort quick_sort heap_sort counting_sort radix_sort sort_colors kth_largest merge_intervals meeting_rooms largest_number wiggle_sort dutch_national_flag)
              ;;
            searching)
              NAMES=(binary_search search_rotated find_peak search_2d_matrix find_first_last sqrt_x search_insert koko_bananas median_sorted find_min_rotated capacity_to_ship split_array aggressive_cows allocate_books painters_partition)
              ;;
            hashing)
              NAMES=(two_sum_hash group_anagrams valid_anagram longest_substr_no_repeat subarray_sum_k top_k_frequent contiguous_array lru_cache isomorphic_strings word_pattern find_duplicates happy_number encode_decode longest_palindrome count_primes)
              ;;
            heap)
              NAMES=(kth_largest_stream merge_k_lists find_median_stream top_k_frequent_heap reorganize_string k_closest_points smallest_range ugly_number meeting_rooms_ii skyline_problem sliding_window_median sort_nearly_sorted connect_ropes last_stone_weight kth_smallest_matrix)
              ;;
            recursion)
              NAMES=(fibonacci power_of_two generate_parentheses subsets permutations letter_combinations combination_sum tower_of_hanoi flood_fill pow_x_n count_and_say flatten_nested_list different_ways_to_compute reverse_string_recursive string_permutations)
              ;;
            backtracking)
              NAMES=(n_queens sudoku_solver word_search combination_sum_bt palindrome_partition_bt restore_ip letter_case_permutations partition_k_equal matchsticks_to_square path_with_max_gold rat_in_maze knight_tour m_coloring subset_sum_bt hamiltonian_path)
              ;;
            greedy)
              NAMES=(activity_selection fractional_knapsack jump_game_greedy gas_station candy_distribution min_platforms job_sequencing huffman_coding partition_labels queue_reconstruction min_arrows hand_of_straights remove_k_digits boats_to_save max_units_on_truck)
              ;;
            bit-manipulation)
              NAMES=(single_number count_bits reverse_bits missing_number power_of_two_bits hamming_distance subsets_bitmask number_complement total_hamming gray_code max_xor decode_xored sum_two_integers utf8_validation xor_queries)
              ;;
            strings)
              NAMES=(reverse_string valid_palindrome longest_palindrome_substr string_to_integer zigzag_conversion implement_strstr multiply_strings group_anagrams_str min_window_substring longest_repeating_replace encode_decode_str palindromic_substrings rabin_karp kmp_search)
              ;;
            two-pointers)
              NAMES=(two_sum_sorted three_sum_tp container_most_water remove_duplicates valid_palindrome_tp sort_colors_tp trap_rain_water_tp four_sum backspace_compare boats_to_save_tp partition_labels_tp longest_mountain push_dominoes fruit_baskets max_consecutive)
              ;;
            sliding-window)
              NAMES=(max_sum_subarray_k longest_substr_k_distinct min_window_substr fruit_baskets_sw permutation_in_string find_all_anagrams longest_repeating_sw max_consecutive_sw grumpy_bookstore max_points_from_cards count_nice_subarrays binary_subarrays_sum shortest_subarray min_operations subarrays_product_less_k)
              ;;
            binary-search)
              NAMES=(binary_search_basic search_rotated_bs find_peak_bs first_bad_version search_insert_bs find_min_rotated_bs time_based_store koko_bananas_bs capacity_ship_bs split_array_bs median_sorted_bs aggressive_cows_bs allocate_books_bs magnetic_balls painters_partition_bs)
              ;;
            trie)
              NAMES=(implement_trie word_search_ii add_search_word longest_word replace_words map_sum_pairs palindrome_pairs maximum_xor_trie concatenated_words prefix_suffix_search search_suggestions word_abbreviation magic_dictionary auto_complete contacts_search)
              ;;
          esac

          PROBLEM="${NAMES[$((RANDOM % ${#NAMES[@]}))]}"
          FILE="$TOPIC/${PROBLEM}.py"

          # Generate solution content using Python
          python3 << PYEOF > "$FILE"
          import random
          import datetime

          topic = "$TOPIC"
          problem = "$PROBLEM"
          diff = "$DIFF"
          num = $PROBLEM_NUM

          templates = {
              "arrays": '''from typing import List


          class Solution:
              def solve(self, nums: List[int]) -> List[int]:
                  """
                  {diff} | LC #{num}
                  Approach: hash map for O(n) lookup
                  """
                  seen = {}
                  result = []
                  for i, num in enumerate(nums):
                      complement = -num
                      if complement in seen:
                          result.append([seen[complement], i])
                      seen[num] = i
                  return result


          if __name__ == "__main__":
              sol = Solution()
              print(sol.solve([2, 7, 11, 15]))
              print(sol.solve([3, 2, 4]))
          ''',
              "linked-list": '''from typing import Optional


          class ListNode:
              def __init__(self, val=0, next=None):
                  self.val = val
                  self.next = next


          class Solution:
              def solve(self, head: Optional[ListNode]) -> Optional[ListNode]:
                  """
                  {diff} | LC #{num}
                  Approach: two pointer - slow and fast
                  """
                  prev = None
                  curr = head
                  while curr:
                      nxt = curr.next
                      curr.next = prev
                      prev = curr
                      curr = nxt
                  return prev


          if __name__ == "__main__":
              head = ListNode(1, ListNode(2, ListNode(3, ListNode(4, ListNode(5)))))
              sol = Solution()
              res = sol.solve(head)
              while res:
                  print(res.val, end=" ")
                  res = res.next
          ''',
              "trees": '''from typing import Optional, List


          class TreeNode:
              def __init__(self, val=0, left=None, right=None):
                  self.val = val
                  self.left = left
                  self.right = right


          class Solution:
              def solve(self, root: Optional[TreeNode]) -> int:
                  """
                  {diff} | LC #{num}
                  Approach: recursive DFS
                  """
                  if not root:
                      return 0
                  left = self.solve(root.left)
                  right = self.solve(root.right)
                  return 1 + max(left, right)


          if __name__ == "__main__":
              root = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
              print(Solution().solve(root))
          ''',
              "graphs": '''from typing import List
          from collections import deque, defaultdict


          class Solution:
              def solve(self, n: int, edges: List[List[int]]) -> bool:
                  """
                  {diff} | LC #{num}
                  Approach: BFS traversal with visited set
                  """
                  graph = defaultdict(list)
                  for u, v in edges:
                      graph[u].append(v)
                      graph[v].append(u)

                  visited = set()
                  queue = deque([0])
                  visited.add(0)

                  while queue:
                      node = queue.popleft()
                      for nb in graph[node]:
                          if nb not in visited:
                              visited.add(nb)
                              queue.append(nb)

                  return len(visited) == n


          if __name__ == "__main__":
              print(Solution().solve(5, [[0,1],[0,2],[0,3],[1,4]]))
              print(Solution().solve(5, [[0,1],[0,2],[3,4]]))
          ''',
              "dynamic-programming": '''from typing import List


          class Solution:
              def solve(self, nums: List[int], target: int) -> int:
                  """
                  {diff} | LC #{num}
                  Approach: bottom-up tabulation
                  """
                  dp = [float("inf")] * (target + 1)
                  dp[0] = 0
                  for i in range(1, target + 1):
                      for num in nums:
                          if num <= i and dp[i - num] != float("inf"):
                              dp[i] = min(dp[i], dp[i - num] + 1)
                  return dp[target] if dp[target] != float("inf") else -1


          if __name__ == "__main__":
              sol = Solution()
              print(sol.solve([1, 5, 11], 11))
              print(sol.solve([2, 5, 10], 6))
          ''',
              "sorting": '''from typing import List


          class Solution:
              def merge_sort(self, arr: List[int]) -> List[int]:
                  """
                  {diff} | LC #{num}
                  Approach: divide and conquer - O(n log n)
                  """
                  if len(arr) <= 1:
                      return arr
                  mid = len(arr) // 2
                  left = self.merge_sort(arr[:mid])
                  right = self.merge_sort(arr[mid:])
                  return self._merge(left, right)

              def _merge(self, left, right):
                  result = []
                  i = j = 0
                  while i < len(left) and j < len(right):
                      if left[i] <= right[j]:
                          result.append(left[i])
                          i += 1
                      else:
                          result.append(right[j])
                          j += 1
                  result.extend(left[i:])
                  result.extend(right[j:])
                  return result


          if __name__ == "__main__":
              print(Solution().merge_sort([38, 27, 43, 3, 9, 82, 10]))
          ''',
          }

          # Pick the best matching template or fall back to a generic one
          default = '''from typing import List


          class Solution:
              def solve(self, nums: List[int]) -> int:
                  """
                  {diff} | LC #{num}
                  """
                  if not nums:
                      return 0
                  seen = set()
                  longest = 0
                  for n in nums:
                      if n - 1 not in seen:
                          curr = n
                          streak = 1
                          while curr + 1 in seen:
                              curr += 1
                              streak += 1
                          longest = max(longest, streak)
                      seen.add(n)
                  return longest


          if __name__ == "__main__":
              print(Solution().solve([100, 4, 200, 1, 3, 2]))
          '''

          code = templates.get(topic, default).format(diff=diff, num=num)
          print(code.strip())
          PYEOF

          git add "$FILE"

          # Commit message
          MSGS=(
            "solve: $PROBLEM ($DIFF)"
            "add $TOPIC - $PROBLEM solution"
            "solved $PROBLEM #$PROBLEM_NUM"
            "$TOPIC: completed $PROBLEM"
            "add solution for $PROBLEM"
            "$TOPIC/$PROBLEM - $DIFF"
            "practice: $PROBLEM ($TOPIC)"
            "solved #$PROBLEM_NUM $PROBLEM"
            "done: $PROBLEM [$DIFF]"
          )
          COMMIT_MSG="${MSGS[$((RANDOM % ${#MSGS[@]}))]}"

          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"

      - name: Push
        run: git push
