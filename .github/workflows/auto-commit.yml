"""
Problem: Dynamic programming - optimization / counting
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Bottom-up tabulation
- State: dp[i] = optimal solution up to index i
- Transition: dp[i] = min/max of previous states
- Time: O(n*k), Space: O(n)
"""
from typing import List


class Solution:
    def solve(self, nums: List[int], target: int) -> int:
        dp = [float('inf')] * (target + 1)
        dp[0] = 0

        for i in range(1, target + 1):
            for num in nums:
                if num <= i and dp[i - num] != float('inf'):
                    dp[i] = min(dp[i], dp[i - num] + 1)

        return dp[target] if dp[target] != float('inf') else -1


if __name__ == "__main__":
    sol = Solution()
    print(sol.solve([1, 5, 11], 11))  # 1
    print(sol.solve([2, 5, 10], 6))   # 3
    print(sol.solve([2], 3))          # -1
