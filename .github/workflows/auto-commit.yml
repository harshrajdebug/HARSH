"""
Problem: Binary tree traversal / property check
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Recursive DFS traversal
- Track depth/path at each node
- Time: O(n), Space: O(h) where h is height
"""
from typing import Optional, List


class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right


class Solution:
    def maxDepth(self, root: Optional[TreeNode]) -> int:
        if not root:
            return 0
        return 1 + max(
            self.maxDepth(root.left),
            self.maxDepth(root.right)
        )

    def isBalanced(self, root: Optional[TreeNode]) -> bool:
        def check(node):
            if not node:
                return 0
            left = check(node.left)
            right = check(node.right)
            if left == -1 or right == -1 or abs(left - right) > 1:
                return -1
            return 1 + max(left, right)

        return check(root) != -1


if __name__ == "__main__":
    root = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))
    sol = Solution()
    print(f"Max depth: {sol.maxDepth(root)}")
    print(f"Balanced: {sol.isBalanced(root)}")
