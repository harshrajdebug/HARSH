"""
Problem: Sorting algorithm / interval problem
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Implemented from scratch for practice
- Divide and conquer strategy
- Time: O(n log n) average, Space: O(log n) stack
"""
from typing import List


class Solution:
    def mergeSort(self, arr: List[int]) -> List[int]:
        if len(arr) <= 1:
            return arr

        mid = len(arr) // 2
        left = self.mergeSort(arr[:mid])
        right = self.mergeSort(arr[mid:])

        return self._merge(left, right)

    def _merge(self, left: List[int], right: List[int]) -> List[int]:
        result = []
        i = j = 0

        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                result.append(left[i])
                i += 1
            else:
                result.append(right[j])
                j += 1

        result.extend(left[i:])
        result.extend(right[j:])
        return result


if __name__ == "__main__":
    sol = Solution()
    print(sol.mergeSort([38, 27, 43, 3, 9, 82, 10]))
    print(sol.mergeSort([5, 1, 4, 2, 8]))
