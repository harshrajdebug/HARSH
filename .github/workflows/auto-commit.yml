"""
Problem: Graph traversal problem
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- BFS/DFS on adjacency list
- Visited set to avoid cycles
- Time: O(V + E), Space: O(V)
"""
from typing import List
from collections import deque, defaultdict


class Solution:
    def solve(self, n: int, edges: List[List[int]]) -> bool:
        graph = defaultdict(list)
        for u, v in edges:
            graph[u].append(v)
            graph[v].append(u)

        visited = set()
        queue = deque([0])
        visited.add(0)

        while queue:
            node = queue.popleft()
            for neighbor in graph[node]:
                if neighbor not in visited:
                    visited.add(neighbor)
                    queue.append(neighbor)

        return len(visited) == n


if __name__ == "__main__":
    sol = Solution()
    print(sol.solve(5, [[0,1],[0,2],[0,3],[1,4]]))  # True
    print(sol.solve(5, [[0,1],[0,2],[3,4]]))         # False
