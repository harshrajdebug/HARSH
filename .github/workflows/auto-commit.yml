name: Daily Auto Commit

on:
  schedule:
    # Three cron triggers spread across the day (UTC).
    # Each run sleeps a random 0-50 min before committing,
    # so the actual commit time is unpredictable.
    - cron: "30 2 * * *"   # ~08:00 IST window
    - cron: "0 9 * * *"    # ~14:30 IST window
    - cron: "45 15 * * *"  # ~21:15 IST window
  workflow_dispatch: {}     # manual trigger for testing

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Random delay to avoid patterns
        run: |
          DELAY=$((RANDOM % 3000))   # 0 – 2999 seconds (≈ 0–50 min)
          echo "⏳ Sleeping $DELAY seconds before committing..."
          sleep "$DELAY"

      - name: Generate commit
        run: |
          # ── Config ──
          git config user.name  "harshrajdebug"
          git config user.email "harshrajdebug@users.noreply.github.com"

          # ── Pick a random number of files to touch (1-3) ──
          FILE_COUNT=$(( RANDOM % 3 + 1 ))

          for i in $(seq 1 $FILE_COUNT); do
            # Random directory depth (0-2 levels)
            DEPTH=$(( RANDOM % 3 ))
            DIR_PATH=""
            DIRS=("src" "docs" "notes" "logs" "data" "utils" "lib" "config" "scripts" "tests")
            for d in $(seq 1 $DEPTH); do
              DIR_PATH="${DIR_PATH}${DIRS[$((RANDOM % ${#DIRS[@]}))]}/";
            done

            mkdir -p "${DIR_PATH:-.}"

            # Random file extension
            EXTS=("md" "txt" "json" "log" "yaml" "py" "sh" "cfg")
            EXT="${EXTS[$((RANDOM % ${#EXTS[@]}))]}"

            # Random file name
            NAMES=("update" "notes" "entry" "log" "data" "record" "memo" "draft" "scratch" "trace")
            NAME="${NAMES[$((RANDOM % ${#NAMES[@]}))]}_$(date +%s)_${RANDOM}"

            FILE_PATH="${DIR_PATH}${NAME}.${EXT}"

            # ── Write content ──
            MESSAGES=(
              "Refactored helper utilities"
              "Updated configuration values"
              "Added new log entry"
              "Minor documentation tweaks"
              "Cleaned up data files"
              "Fixed formatting issues"
              "Improved error handling notes"
              "Archived old records"
              "Bumped internal version tracker"
              "Sync'd local changes"
              "Added test scaffolding"
              "Reviewed and updated notes"
              "Checkpoint save"
              "Routine maintenance"
              "Optimized file structure"
            )
            MSG="${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}"

            # Write varied content based on extension
            case "$EXT" in
              json)
                echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"note\": \"$MSG\", \"id\": $RANDOM}" >> "$FILE_PATH"
                ;;
              yaml)
                echo -e "---\ntimestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)\nnote: $MSG\nid: $RANDOM" >> "$FILE_PATH"
                ;;
              py)
                echo -e "# $MSG\n# Auto-generated $(date -u +%Y-%m-%dT%H:%M:%SZ)\n\ndef func_$RANDOM():\n    pass\n" >> "$FILE_PATH"
                ;;
              sh)
                echo -e "#!/bin/bash\n# $MSG\n# $(date -u +%Y-%m-%dT%H:%M:%SZ)\necho \"$RANDOM\"" >> "$FILE_PATH"
                ;;
              *)
                echo "[$( date -u '+%Y-%m-%d %H:%M:%S UTC' )] $MSG (ref: $RANDOM)" >> "$FILE_PATH"
                ;;
            esac

            git add "$FILE_PATH"
          done

          # ── Random commit message ──
          COMMIT_MSGS=(
            "chore: routine update"
            "docs: refreshed notes"
            "feat: added new entries"
            "fix: corrected data"
            "refactor: reorganised files"
            "build: updated configs"
            "style: formatting pass"
            "test: added scaffolding"
            "perf: optimized structure"
            "ci: maintenance commit"
          )
          COMMIT_MSG="${COMMIT_MSGS[$((RANDOM % ${#COMMIT_MSGS[@]}))]}"

          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"

      - name: Push
        run: git push
