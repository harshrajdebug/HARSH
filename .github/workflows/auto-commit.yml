"""
Problem: Linked list traversal and manipulation
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Two pointer technique (slow & fast)
- In-place modification to save space
- Time: O(n), Space: O(1)
"""
from typing import Optional


class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next


class Solution:
    def solve(self, head: Optional[ListNode]) -> Optional[ListNode]:
        if not head or not head.next:
            return head

        prev = None
        curr = head

        while curr:
            nxt = curr.next
            curr.next = prev
            prev = curr
            curr = nxt

        return prev


# Test
if __name__ == "__main__":
    # Build: 1 -> 2 -> 3 -> 4 -> 5
    nodes = [ListNode(i) for i in range(1, 6)]
    for i in range(len(nodes) - 1):
        nodes[i].next = nodes[i + 1]

    sol = Solution()
    result = sol.solve(nodes[0])
    while result:
        print(result.val, end=" -> ")
        result = result.next
    print("None")
