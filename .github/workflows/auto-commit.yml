"""
Problem: General DSA problem
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Optimal solution using standard technique
- Time: O(n), Space: O(n)
"""
from typing import List


class Solution:
    def solve(self, nums: List[int]) -> int:
        if not nums:
            return 0

        seen = set()
        longest = 0

        for num in nums:
            if num - 1 not in seen:
                current = num
                streak = 1
                while current + 1 in seen:
                    current += 1
                    streak += 1
                longest = max(longest, streak)
            seen.add(num)

        return longest


if __name__ == "__main__":
    sol = Solution()
    print(sol.solve([100, 4, 200, 1, 3, 2]))  # 4
    print(sol.solve([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]))  # 9
