"""
Problem: Two pointer / array manipulation approach
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Used optimized iteration with hash map for O(n) time
- Space complexity: O(n) for auxiliary storage
"""
from typing import List


class Solution:
    def solve(self, nums: List[int]) -> List[int]:
        seen = {}
        result = []

        for i, num in enumerate(nums):
            complement = -num
            if complement in seen:
                result.append([seen[complement], i])
            seen[num] = i

        return result


# Test cases
if __name__ == "__main__":
    sol = Solution()
    print(sol.solve([2, 7, 11, 15]))  # expected: [[0, 1]]
    print(sol.solve([3, 2, 4]))       # expected: [[1, 2]]
    print(sol.solve([3, 3]))          # expected: [[0, 1]]
