"""
Problem: Stack / Queue based problem
Difficulty: DIFF_PLACEHOLDER
Platform: LeetCode #NUM_PLACEHOLDER

Approach:
- Monotonic stack for next greater element pattern
- Process elements right to left
- Time: O(n), Space: O(n)
"""
from typing import List
from collections import deque


class Solution:
    def solve(self, nums: List[int]) -> List[int]:
        n = len(nums)
        result = [-1] * n
        stack = []

        for i in range(n - 1, -1, -1):
            while stack and stack[-1] <= nums[i]:
                stack.pop()

            if stack:
                result[i] = stack[-1]

            stack.append(nums[i])

        return result


if __name__ == "__main__":
    sol = Solution()
    print(sol.solve([4, 5, 2, 25]))   # [5, 25, 25, -1]
    print(sol.solve([13, 7, 6, 12]))  # [-1, 12, 12, -1]
